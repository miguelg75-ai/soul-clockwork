    #event-alert { position: absolute; top: 18%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #ef4444; text-shadow: 0 0 14px rgba(239, 68, 68, 0.9); background: rgba(15, 23, 42, 0.9); border: 1px solid #ef4444; padding: 8px 18px; border-radius: 8px; display: none; pointer-events: none; z-index: 20; }
    
    .ui-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(6, 9, 19, 0.94); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-card { background: #0f172a; border: 1px solid #38bdf8; border-radius: 12px; padding: 20px; width: 100%; max-width: 580px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 35px rgba(2, 132, 199, 0.25); max-height: 94vh; overflow-y: auto; }
    
    .classes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
    .class-card { background: #1e293b; border: 2px solid #475569; border-radius: 8px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; text-align: left; transition: 0.15s; }
    .class-card.selected { border-color: #f59e0b; background: #2e1065; box-shadow: 0 0 12px rgba(245, 158, 11, 0.3); }

    .talent-row { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }
    
    .cards-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 500px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
    .upgrade-card { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .upgrade-card.evolution { background: linear-gradient(135deg, #4c1d95, #831843); border: 2px solid #f59e0b; box-shadow: 0 0 16px rgba(245, 158, 11, 0.5); }

    .btn { padding: 12px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }

    .btn-green { background: #22c55e; color: #000; box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }

  <script>

    class MetaManager {
      constructor() {
        this.STORAGE_KEY = 'SOUL_CLOCKWORK_SAVE_V7';
        this.data = this.load();
      }
      load() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          if (!raw) return this.defaultData();
          const d = JSON.parse(raw);
          if (!d.talents) d.talents = {};
          return d;
        } catch { return this.defaultData(); }
      }
      save() { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.data)); }
      defaultData() { return { gold: 0, talents: { vitality: 0, might: 0, swiftness: 0, magnetism: 0 } }; }
      getCost(id) {
        const def = TALENT_DEFS[id], rank = this.data.talents[id] || 0;
        if (rank >= def.maxRank) return Infinity;
        return Math.floor(def.baseCost * Math.pow(def.costMult, rank));
      }
      upgradeTalent(id) {
        const cost = this.getCost(id);
        if (this.data.gold >= cost) {
          this.data.gold -= cost;
          this.data.talents[id] = (this.data.talents[id] || 0) + 1;
          this.save();
          return true;
        }
        return false;
      }
      getStats() {
        const t = this.data.talents;
        return {
          maxHp: 100 + (t.vitality || 0) * TALENT_DEFS.vitality.bonus,
          damageMult: 1.0 + (t.might || 0) * TALENT_DEFS.might.bonus,
          speedMult: 1.0 + (t.swiftness || 0) * TALENT_DEFS.swiftness.bonus,
          pickupMult: 1.0 + (t.magnetism || 0) * TALENT_DEFS.magnetism.bonus
        };
      }
    }

    class AudioEngine {
      constructor() {
        this.ctx = null; this.masterGain = null; this.bgmGain = null; this.sfxGain = null; this.isMuted = false;
        this.isPlayingBGM = false; this.nextNoteTime = 0; this.step = 0; this.timerID = null;
        this.mapType = 'ether';
        
        this.scaleEther = [130.81, 146.83, 155.56, 174.61, 196.00, 207.65, 246.94, 261.63]; 
        this.basslineEther = [0, 0, 2, 2, 3, 3, 4, 4, 5, 5, 4, 4, 6, 6, 4, 2];
        
        this.scaleRust = [110.00, 116.54, 138.59, 146.83, 164.81, 174.61, 196.00, 220.00]; 
        this.basslineRust = [0, 0, 0, 1, 0, 0, 3, 1, 0, 0, 0, 1, 4, 3, 1, 0];
      }
      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = 0.35; this.masterGain.connect(this.ctx.destination);
        this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.18; this.bgmGain.connect(this.masterGain);
        this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.6; this.sfxGain.connect(this.masterGain);
        this.startBGM();
      }
      setMap(map) {
        this.mapType = map;
      }
      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain) this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.35, this.ctx.currentTime);
        return !this.isMuted;
      }
      startBGM() {
        if (this.isPlayingBGM || !this.ctx) return;
        this.isPlayingBGM = true; this.nextNoteTime = this.ctx.currentTime + 0.05;
        this.schedule();
      }
      schedule() {
        if (!this.isPlayingBGM || !this.ctx) return;
        while (this.nextNoteTime < this.ctx.currentTime + 0.2) {
          this.playBGMStep(this.nextNoteTime, this.step);
          this.nextNoteTime += 0.25 * (60.0 / 128.0);
          this.step = (this.step + 1) % 16;
        }
        this.timerID = setTimeout(() => this.schedule(), 50);
      }
      playBGMStep(time, step) {
        if (!this.ctx || !this.bgmGain) return;
        const isRust = this.mapType === 'rust';
        const scale = isRust ? this.scaleRust : this.scaleEther;
        const bassline = isRust ? this.basslineRust : this.basslineEther;

        if (step % 4 === 0) {
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = isRust ? 'square' : 'triangle'; 
          osc.frequency.setValueAtTime(isRust ? 90 : 110, time); 
          osc.frequency.exponentialRampToValueAtTime(isRust ? 20 : 30, time + 0.08);
          g.gain.setValueAtTime(isRust ? 0.4 : 0.5, time); g.gain.linearRampToValueAtTime(0, time + 0.08);
          osc.connect(g); g.connect(this.bgmGain); osc.start(time); osc.stop(time + 0.09);
        }
        
        if (step % 2 === 0 || (isRust && step % 4 === 3)) {
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = isRust ? 'square' : 'sawtooth'; 
          osc.frequency.setValueAtTime(scale[bassline[step % bassline.length]] * 0.5, time);
          g.gain.setValueAtTime(isRust ? 0.2 : 0.3, time); g.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
          osc.connect(g); g.connect(this.bgmGain); osc.start(time); osc.stop(time + 0.2);
        }
      }
      playShoot() {
        if (!this.ctx || !this.sfxGain) return;
        const t = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(380, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
        g.gain.setValueAtTime(0.3, t); g.gain.linearRampToValueAtTime(0, t + 0.08);
        osc.connect(g); g.connect(this.sfxGain); osc.start(t); osc.stop(t + 0.08);
      }
      playHit() {
        if (!this.ctx || !this.sfxGain) return;
        const t = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(180, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
        g.gain.setValueAtTime(0.3, t); g.gain.linearRampToValueAtTime(0, t + 0.08);
        osc.connect(g); g.connect(this.sfxGain); osc.start(t); osc.stop(t + 0.08);
      }
      playExplosion() {
        if (!this.ctx || !this.sfxGain) return;
        const t = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(20, t + 0.3);
        g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.connect(g); g.connect(this.sfxGain); osc.start(t); osc.stop(t + 0.35);
      }
      playGem() {
        if (!this.ctx || !this.sfxGain) return;
        const t = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(1320, t + 0.04);
        g.gain.setValueAtTime(0.18, t); g.gain.linearRampToValueAtTime(0, t + 0.05);
        osc.connect(g); g.connect(this.sfxGain); osc.start(t); osc.stop(t + 0.05);
      }
      playLevelUp() {
        if (!this.ctx || !this.sfxGain) return;
        const t = this.ctx.currentTime;
        [261.63, 329.63, 392.00, 523.25].forEach((f, i) => {
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = f;
          const st = t + i * 0.06;
          g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.3, st + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.4);
          osc.connect(g); g.connect(this.sfxGain); osc.start(st); osc.stop(st + 0.45);
        });
      }
      playEvolutionFanfare() {
        if (!this.ctx || !this.sfxGain) return;
        const t = this.ctx.currentTime;
        [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.value = f;
          const st = t + i * 0.07;
          g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.35, st + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.6);
          osc.connect(g); g.connect(this.sfxGain); osc.start(st); osc.stop(st + 0.65);
        });
      }
    }

    class ObjectPool {
      constructor(factory, size) {
        this.pool = new Array(size); this.free = new Array(size); this.count = size;
        for (let i = 0; i < size; i++) { this.pool[i] = factory(); this.pool[i].active = false; this.free[i] = i; }
      }
      obtain() {
        if (this.count === 0) return null;
        this.count--;
        const inst = this.pool[this.free[this.count]];
        inst.active = true; inst.reset(); return inst;
      }
      release(inst) {
        const idx = this.pool.indexOf(inst);
        if (idx === -1 || !inst.active) return;
        inst.active = false; this.free[this.count] = idx; this.count++;
      }
      getActive() { return this.pool; }
    }

    class SpatialGrid {
      constructor(w, h, cell = 64) {
        this.cell = cell; this.cols = Math.ceil(w / cell); this.rows = Math.ceil(h / cell);
        const total = this.cols * this.rows;
        this.grid = new Array(total).fill(0).map(() => new Array(64).fill(-1));
        this.counts = new Array(total).fill(0);
      }
      clear() { this.counts.fill(0); }
      insert(x, y, poolIdx) {
        const c = Math.floor(x / this.cell), r = Math.floor(y / this.cell);
        if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return;
        const idx = r * this.cols + c;
        if (this.counts[idx] < 64) { this.grid[idx][this.counts[idx]] = poolIdx; this.counts[idx]++; }
      }
      query(x, y, rad, out) {
        let n = 0;
        const minC = Math.max(0, Math.floor((x - rad) / this.cell)), maxC = Math.min(this.cols - 1, Math.floor((x + rad) / this.cell));
        const minR = Math.max(0, Math.floor((y - rad) / this.cell)), maxR = Math.min(this.rows - 1, Math.floor((y + rad) / this.cell));
        for (let r = minR; r <= maxR; r++) {
          for (let c = minC; c <= maxC; c++) {
            const idx = r * this.cols + c, cnt = this.counts[idx];
            for (let i = 0; i < cnt; i++) out[n++] = this.grid[idx][i];
          }
        }
        return n;
      }
    }
    
    class DamageText {
      constructor() { this.active = false; this.x = 0; this.y = 0; this.life = 0; this.maxLife = 0.5; this.text = ''; this.isCrit = false; }
      reset() { this.life = 0; }
      init(x, y, amt, isCrit) {
        this.active = true;
        this.x = x + (Math.random() * 16 - 8);
        this.y = y + (Math.random() * 12 - 6);
        this.text = Math.floor(amt).toString();
        this.isCrit = isCrit;
        this.life = 0;
        this.maxLife = isCrit ? 0.7 : 0.5;
      }
      update(dt, pool) {
        if (!this.active) return;
        this.y -= (this.isCrit ? 45 : 30) * dt;
        this.life += dt;
        if (this.life >= this.maxLife) pool.release(this);
      }
      render(ctx) {
        if (!this.active) return;
        const progress = this.life / this.maxLife;
        const alpha = Math.max(0, 1 - Math.pow(progress, 3));
        const scale = this.isCrit ? (1.5 - progress * 0.4) : (1.0 - progress * 0.2);
        
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(this.x, this.y);
        ctx.scale(scale, scale);
        ctx.font = this.isCrit ? '900 14px sans-serif' : 'bold 12px sans-serif';
        ctx.fillStyle = this.isCrit ? '#fde047' : '#e2e8f0';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2.5;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeText(this.text, 0, 0);
        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    class AcidPuddle {

      }
      update(dt, pool, sparkPool) {

        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.isHostile ? 7 : (this.isGatling ? 8 : 5), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    class Enemy {
      constructor() { 
        this.active = false; this.x = 0; this.y = 0; this.hp = 20; this.maxHp = 20; this.speed = 85; 
        this.radius = 10; this.damage = 8; this.kx = 0; this.ky = 0; this.type = 0; 
        this.isBoss = false; this.isFinalBoss = false; this.shootTimer = 0; this.flashTimer = 0; this.animTimer = 0; 
        this.isKamikaze = false; this.isShielded = false; this.facing = 0;
      }
      reset() { 
        this.kx = this.ky = 0; this.isBoss = false; this.isFinalBoss = false; 
        this.shootTimer = 0; this.flashTimer = 0; this.isKamikaze = false; this.isShielded = false; this.facing = 0;
      }
      init(type, x, y, diff, eclipseMode = false) {
        this.x = x; this.y = y; this.type = type; this.isBoss = false; this.isFinalBoss = false;
        if (type === 0) { this.maxHp = 16 * diff; this.speed = 95; this.radius = 9; this.damage = 6; }
        else if (type === 1) { this.maxHp = 70 * diff; this.speed = 45; this.radius = 16; this.damage = 14; }
        else if (type === 2) { this.maxHp = 35 * diff; this.speed = 65; this.radius = 12; this.damage = 10; }
        else if (type === 3) { this.maxHp = 24 * diff; this.speed = 120; this.radius = 10; this.damage = 8; }
        else if (type === 4) { this.maxHp = 45 * diff; this.speed = 55; this.radius = 13; this.damage = 10; }
        else if (type === 5) { this.maxHp = 18 * diff; this.speed = 150; this.radius = 12; this.damage = 30; this.isKamikaze = true; } 
        else if (type === 6) { this.maxHp = 130 * diff; this.speed = 35; this.radius = 18; this.damage = 15; this.isShielded = true; }
        else if (type === 99) { this.isBoss = true; this.maxHp = 650 * diff; this.speed = 52; this.radius = 32; this.damage = 25; }
        else if (type === 100) { this.isFinalBoss = true; this.isBoss = true; this.maxHp = 1800 * diff; this.speed = 65; this.radius = 36; this.damage = 30; }
        
        if (eclipseMode) {
            this.maxHp *= 2;
            this.speed *= 1.35;
            this.damage *= 1.5;
        }
        
        this.hp = this.maxHp;
      }
      applyDamage(amt, px, py) {
        if (this.isShielded && (px !== 0 || py !== 0)) {
          const projAngle = Math.atan2(py, px);
          const diffAng = Math.abs(projAngle - this.facing);
          const diffNorm = Math.min((2 * Math.PI) - diffAng, diffAng);
          if (diffNorm > 1.8) {
            amt *= 0.15;
            this.flashTimer = 0.08;
          }
        }
        this.hp -= amt;
        const pushMult = this.isBoss ? 0.12 : (this.isShielded ? 0.25 : 1.0);
        this.kx += px * 130 * pushMult; this.ky += py * 130 * pushMult;
        this.flashTimer = 0.08; 
        return this.hp <= 0;
      }
      update(dt, tx, ty, projPool) {
        if (!this.active) return;
        this.animTimer += dt * 6;
        const dx = tx - this.x, dy = ty - this.y, dist = Math.hypot(dx, dy) || 1;
        this.facing = Math.atan2(dy, dx);
        
        this.kx *= Math.max(0, 1 - dt * 6); this.ky *= Math.max(0, 1 - dt * 6);
        if (this.type === 4 || this.isFinalBoss) {
          this.shootTimer += dt;
          const rate = this.isFinalBoss ? 1.4 : 2.5;
          if (this.shootTimer >= rate) {
            this.shootTimer = 0;
            if (this.isFinalBoss) {
              for (let a = -2; a <= 2; a++) {
                const angle = this.facing + (a * 0.18);
                const p = projPool.obtain();
                if (p) p.init(this.x, this.y, Math.cos(angle), Math.sin(angle), 16, 260, 1, true, '#f43f5e');
              }
            } else {
              const p = projPool.obtain();
              if (p) p.init(this.x, this.y, dx / dist, dy / dist, 12, 220, 1, true, '#eab308');
            }
          }
        }
        this.x += ((dx / dist) * this.speed + this.kx) * dt;
        this.y += ((dy / dist) * this.speed + this.ky) * dt;
        if (this.flashTimer > 0) this.flashTimer -= dt;
      }
      render(ctx) {
        if (!this.active) return;
        ctx.save(); ctx.translate(this.x, this.y);
        
        ctx.shadowBlur = 15;
        if (this.type === 0) ctx.shadowColor = '#818cf8';
        else if (this.type === 5) ctx.shadowColor = '#ef4444';
        else if (this.isBoss) ctx.shadowColor = this.isFinalBoss ? '#c084fc' : '#f97316';
        else ctx.shadowColor = 'rgba(0,0,0,0)';

        if (this.flashTimer > 0) {
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, this.radius + 2, 0, Math.PI * 2); ctx.fill();
          ctx.restore(); 
          return;
        }
        if (this.type === 0) {
          ctx.fillStyle = '#818cf8'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, Math.sin(this.animTimer) * 0.2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#c084fc'; ctx.beginPath(); ctx.arc(6, -2, 2, 0, Math.PI * 2); ctx.arc(6, 2, 2, 0, Math.PI * 2); ctx.fill();
        } else if (this.type === 1) {
          ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#f97316'; ctx.fillRect(-8, -4, 16, 8);
          ctx.strokeStyle = '#b45309'; ctx.lineWidth = 3; ctx.stroke();
        } else if (this.type === 2) {
          ctx.fillStyle = 'rgba(6, 182, 212, 0.7)'; ctx.beginPath(); ctx.arc(0, -3 + Math.sin(this.animTimer) * 2, 10, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#e0f2fe'; ctx.beginPath(); ctx.arc(-3, -4, 1.5, 0, Math.PI * 2); ctx.arc(3, -4, 1.5, 0, Math.PI * 2); ctx.fill();
        } else if (this.type === 3) {
          ctx.fillStyle = '#e11d48'; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(8, 8); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill();
        } else if (this.type === 4) {
          ctx.fillStyle = '#ca8a04'; ctx.beginPath(); ctx.arc(0, -4, 6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#422006'; ctx.beginPath(); ctx.moveTo(-9, 10); ctx.lineTo(0, -5); ctx.lineTo(9, 10); ctx.closePath(); ctx.fill();
        } else if (this.type === 5) {
          ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, 11 * (1 + Math.sin(this.animTimer*1.5)*0.15), 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        } else if (this.type === 6) {
          ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
          ctx.rotate(this.facing);
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(0, 0, 24, -Math.PI/2.5, Math.PI/2.5); ctx.stroke();
        } else if (this.isBoss) {
          ctx.fillStyle = this.isFinalBoss ? '#581c87' : '#991b1b'; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 4; ctx.stroke();
          ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(-10, -6, 4, 0, Math.PI * 2); ctx.arc(10, -6, 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
        
        if (this.isBoss) {
          const barW = this.isFinalBoss ? 90 : 60, barH = 7;
          ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(this.x - barW / 2, this.y - this.radius - 16, barW, barH);
          ctx.fillStyle = this.isFinalBoss ? '#c084fc' : '#ef4444'; ctx.fillRect(this.x - barW / 2, this.y - this.radius - 16, barW * (this.hp / this.maxHp), barH);
        }
      }
    }

    class Gem {
      constructor() { this.active = false; this.x = 0; this.y = 0; this.val = 10; this.attracted = false; this.spd = 0; }
      reset() { this.attracted = false; this.spd = 0; }
      init(x, y, val) { this.x = x; this.y = y; this.val = val; }
      update(dt, px, py, rad, pool, onCollect) {
        if (!this.active) return;
        const dx = px - this.x, dy = py - this.y, d = Math.hypot(dx, dy);
        if (!this.attracted && d < rad) this.attracted = true;
        if (this.attracted) {
          if (d < 18) { onCollect(this.val); pool.release(this); return; }
          this.spd = Math.min(680, this.spd + 900 * dt);
          this.x += (dx / d) * this.spd * dt; this.y += (dy / d) * this.spd * dt;
        }
      }
      render(ctx) {
        if (!this.active) return;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = 15; ctx.shadowColor = '#38bdf8';
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

        this.weapons = {};
        this.passives = {};

        this.touchActive = false;
        this.touchOriginX = 0; this.touchOriginY = 0;

        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.renderMapSelector();
        this.renderClassSelector();
        this.renderTalentsMenu();
        this.start();
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      initEvents() {
        const unlockAudio = () => this.audio.init();
        window.addEventListener('click', unlockAudio, { once: true });
        window.addEventListener('touchstart', unlockAudio, { once: true });
        window.addEventListener('keydown', unlockAudio, { once: true });
        window.addEventListener('keydown', (e) => this.keys[e.code] = true);
        window.addEventListener('keyup', (e) => this.keys[e.code] = false);
        this.canvas.addEventListener('pointerdown', (e) => {
          if (this.isPaused) return;
          this.touchActive = true;
          this.touchOriginX = this.touchCurrentX = e.clientX;
          this.touchOriginY = this.touchCurrentY = e.clientY;
        });
        window.addEventListener('pointermove', (e) => {
          if (!this.touchActive || this.isPaused) return;
          this.touchCurrentX = e.clientX;
          this.touchCurrentY = e.clientY;
          const dx = e.clientX - this.touchOriginX, dy = e.clientY - this.touchOriginY, d = Math.hypot(dx, dy);
          if (d > 5) {
            const rad = Math.min(50, d);
            this.inputX = (dx / d) * (rad / 50);
            this.inputY = (dy / d) * (rad / 50);
          }
        });
        const resetTouch = () => { this.touchActive = false; this.inputX = this.inputY = 0; };
        window.addEventListener('pointerup', resetTouch);
        window.addEventListener('pointercancel', resetTouch);
        document.getElementById('btn-start').onclick = () => {
          this.audio.init();
          this.startRun();
        };
        document.getElementById('btn-toggle-audio').onclick = () => {
          const on = this.audio.toggleMute();

            <div style="font-size:10px; color:#cbd5e1;">${m.desc}</div>

          card.onclick = () => { this.selectedMap = k; this.renderMapSelector(); };

        Object.keys(CLASSES).forEach((k) => {

          const card = document.createElement('div');
          card.className = `class-card ${this.selectedClass === k ? 'selected' : ''}`;
          card.innerHTML = `
            <div style="font-weight:bold; font-size:12px; color:#fcd34d;">${c.name}</div>

      renderTalentsMenu() {
        document.getElementById('menu-gold-txt').innerText = `🪙 Oro Total: ${this.meta.data.gold}`;
        const list = document.getElementById('talents-container');
        list.innerHTML = '';
        Object.keys(TALENT_DEFS).forEach((id) => {
          const def = TALENT_DEFS[id], rank = this.meta.data.talents[id] || 0, cost = this.meta.getCost(id), isMax = rank >= def.maxRank;
          const row = document.createElement('div');
          row.className = 'talent-row';
          row.innerHTML = `
            <div style="display:flex; flex-direction:column;">
              <span style="font-weight:bold; font-size:12px; color:#fcd34d;">${def.name} (${rank}/${def.maxRank})</span>
              <span style="font-size:10px; color:#94a3b8;">${def.desc}</span>
            </div>
            <button class="btn btn-gold" style="padding: 6px 10px; font-size: 11px;" ${isMax || this.meta.data.gold < cost ? 'disabled' : ''}>
              ${isMax ? 'MÁX' : `🪙 ${cost}`}
            </button>
          `;
          row.querySelector('button').onclick = () => {
            if (this.meta.upgradeTalent(id)) this.renderTalentsMenu();
          };
          list.appendChild(row);
        });
      }
      startRun() {
        this.eclipseMode = document.getElementById('eclipse-toggle').checked;
        this.audio.setMap(this.selectedMap);
        const stats = this.meta.getStats();
        const cls = CLASSES[this.selectedClass];
        this.maxHp = Math.max(20, stats.maxHp + cls.hpMod);
        this.hp = this.maxHp;
        this.speed = Math.max(120, (175 + cls.spdMod) * stats.speedMult);
        this.px = 400; this.py = 300; this.level = 1; this.xp = 0; this.xpNext = 60;
        this.runGold = 0; this.kills = 0; this.gameTime = 0;
        this.weapons = {};
        this.weapons[cls.weapon] = 1;
        this.passives = {};
        this.chests = [];
        this.puddles = [];
        this.hasRevived = false;
        this.eventsTriggered = { min2_golem: false, min330_swarm: false, min5_blackout: false, min8_finalboss: false };
        this.isPaused = false;
        document.getElementById('menu-ui').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        this.updateHUD();
      }
      start() {
        let last = performance.now();
        const loop = (now) => {
          const dt = Math.min((now - last) / 1000, 0.1); last = now;
          if (!this.isPaused) this.update(dt);
          this.render(dt);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
      hitEnemy(e, baseDmg, px, py) {
        const isCrit = Math.random() < (this.selectedClass === 'chronos' ? 0.25 : 0.05);
        const finalDmg = isCrit ? baseDmg * 2.2 : baseDmg;
        const dead = e.applyDamage(finalDmg, px, py);
        
        const txt = this.dmgTextPool.obtain();
        if (txt) txt.init(e.x, e.y - e.radius - 4, finalDmg, isCrit);
        
        if (e.isBoss) this.trauma = Math.min(1.0, this.trauma + (Math.abs(px)>0 ? 0.1 : 0.02));
        if (dead) this.killEnemy(e);
        return dead;
      }
      update(dt) {
        this.gameTime += dt;
        const metaStats = this.meta.getStats();
        let ix = 0, iy = 0;
        if (this.keys['KeyW'] || this.keys['ArrowUp']) iy -= 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) iy += 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) ix -= 1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) ix += 1;
        if (ix !== 0 || iy !== 0) {
          const l = Math.hypot(ix, iy); this.inputX = ix / l; this.inputY = iy / l;
        } else if (!this.touchActive) { this.inputX = this.inputY = 0; }
        if (this.inputX !== 0 || this.inputY !== 0) {
          this.facingX = this.inputX; this.facingY = this.inputY;
          this.px += this.inputX * this.speed * dt;
          this.py += this.inputY * this.speed * dt;
        }
        if (Math.random() < 0.25) {
          const sp = this.smokePool.obtain();
          if (sp) sp.init(this.px + (Math.random() * 8 - 4), this.py + 6, -this.inputX * 20, -this.inputY * 20, 5, 'rgba(203, 213, 225, 0.3)', 0.5);
        }
        const sec = this.gameTime;
        if (sec >= 120 && !this.eventsTriggered.min2_golem) {
          this.eventsTriggered.min2_golem = true;
          this.showAlert('⚠️ MINIBOSS: GÓLEM DE VAPOR', '#ef4444');
          const boss = this.enemyPool.obtain();
          if (boss) boss.init(99, this.px + 400, this.py, 1.0, this.eclipseMode);
          this.trauma = 0.8;
        }
        if (sec >= 210 && !this.eventsTriggered.min330_swarm) {
          this.eventsTriggered.min330_swarm = true;
          this.showAlert('🌀 ¡ENJAMBRE DE RATAS EN ANILLO!', '#a855f7');
          for (let i = 0; i < 70; i++) {
            const angle = (i / 70) * Math.PI * 2;
            const rat = this.enemyPool.obtain();
            if (rat) rat.init(0, this.px + Math.cos(angle) * 520, this.py + Math.sin(angle) * 520, 1.2, this.eclipseMode);
          }
          this.trauma = 0.5;
        }
        if (sec >= 300 && !this.eventsTriggered.min5_blackout) {
          this.eventsTriggered.min5_blackout = true;
          this.showAlert('🌑 APAGÓN DE ÉTER: CULTISTAS ACECHAN', '#eab308');
          for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const c = this.enemyPool.obtain();
            if (c) c.init(4, this.px + Math.cos(angle) * 480, this.py + Math.sin(angle) * 480, 1.4, this.eclipseMode);
          }
          this.trauma = 0.6;
        }
        if (sec >= 480 && !this.eventsTriggered.min8_finalboss) {
          this.eventsTriggered.min8_finalboss = true;
          this.showAlert('👑 ¡JEFE FINAL: EL ARCHIMAGO MECÁNICO!', '#c084fc');
          const finalBoss = this.enemyPool.obtain();
          if (finalBoss) finalBoss.init(100, this.px + 450, this.py, 1.5, this.eclipseMode);
          this.trauma = 1.0;
        }
        
        const min = sec / 60;
        if (Math.random() < Math.min(0.38, 0.08 + min * 0.03)) {
          const e = this.enemyPool.obtain();
          if (e) {
            const ang = Math.random() * Math.PI * 2, sx = this.px + Math.cos(ang) * 450, sy = this.py + Math.sin(ang) * 450;
            let type = 0;
            if (min > 5.0 && Math.random() < 0.3) type = 4;
            else if (min > 2.5 && Math.random() < 0.25) type = 5; 
            else if (min > 3.5 && Math.random() < 0.2) type = 6; 
            else if (min > 3.0 && Math.random() < 0.4) type = 2;
            else if (min > 1.5 && Math.random() < 0.3) type = 3;
            else if (min > 4.0 && Math.random() < 0.2) type = 1;
            e.init(type, sx, sy, 1 + min * 0.2, this.eclipseMode);
          }
        }
        
        this.grid.clear();
        const enemies = this.enemyPool.getActive();
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.active) {
            e.update(dt, this.px, this.py, this.projPool);
            this.grid.insert(e.x, e.y, i);
            if (Math.hypot(this.px - e.x, this.py - e.y) < e.radius + 12) {
              if (e.isKamikaze) {
                this.hp -= e.damage;
                this.trauma = Math.min(1.0, this.trauma + 0.6);
                this.killEnemy(e); 
                if (this.hp <= 0) { this.hp = 0; this.triggerGameOver(true); return; }
                continue;
              } else {
                this.hp -= e.damage * dt;
                if (this.hp <= 0) { this.hp = 0; this.triggerGameOver(true); return; }
              }
            }
          }
        }
        
        this.updateWeapons(dt, metaStats);

        for (let i = this.puddles.length - 1; i >= 0; i--) {
          const p = this.puddles[i];
          p.update(dt, this.grid, enemies, this.nearbyBuf, (e, dmg) => this.hitEnemy(e, dmg, 0, 0));
          if (!p.active) this.puddles.splice(i, 1);
        }

        const projs = this.projPool.getActive();
        for (let i = 0; i < projs.length; i++) {
          const p = projs[i];
          if (!p.active) continue;
          p.update(dt, this.projPool, this.sparkPool);
          if (!p.active) continue;
          if (p.isHostile) {
            if (Math.hypot(this.px - p.x, this.py - p.y) < 14) {
              this.hp -= p.damage;
              this.trauma = Math.min(1.0, this.trauma + 0.3);
              this.projPool.release(p);
              if (this.hp <= 0) { this.hp = 0; this.triggerGameOver(true); return; }
            }
          } else {
            const count = this.grid.query(p.x, p.y, 24, this.nearbyBuf);
            for (let k = 0; k < count; k++) {
              const e = enemies[this.nearbyBuf[k]];
              if (e && e.active && Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 4) {
                const dmg = p.damage * metaStats.damageMult * (1 + (this.passives.volatile_oil || 0) * 0.15);
                this.hitEnemy(e, dmg, p.vx / 520, p.vy / 520);
                this.audio.playHit();
                
                for(let s=0; s<4; s++) {
                  const sp = this.sparkPool.obtain();
                  if(sp) sp.init(p.x, p.y, (Math.random()-0.5)*300, (Math.random()-0.5)*300 - 150, p.color);
                }

                if (!p.isGatling) {
                  p.pierce--;
                  if (p.pierce <= 0) { this.projPool.release(p); break; }
                }
              }
            }
          }
        }
        
        const sparks = this.sparkPool.getActive();
        for (let i = 0; i < sparks.length; i++) {
          if (sparks[i].active) sparks[i].update(dt, this.sparkPool);
        }
        
        const dmgTexts = this.dmgTextPool.getActive();
        for (let i = 0; i < dmgTexts.length; i++) {
          dmgTexts[i].update(dt, this.dmgTextPool);
        }
        
        const gems = this.gemPool.getActive();
        const pickupRad = 70 * metaStats.pickupMult * (1 + (this.passives.cobalt_magnet || 0) * 0.30);
        for (let i = 0; i < gems.length; i++) {
          gems[i].update(dt, this.px, this.py, pickupRad, this.gemPool, (val) => {
            this.audio.playGem(); this.addXP(val);
          });
        }
        
        for (let i = this.chests.length - 1; i >= 0; i--) {
          const ch = this.chests[i];
          if (ch.active && Math.hypot(this.px - ch.x, this.py - ch.y) < 26) {
            ch.active = false;
            this.chests.splice(i, 1);
            this.openChest();
          }
        }
        if (this.trauma > 0) this.trauma = Math.max(0, this.trauma - dt * 1.8);
        this.updateHUD();
      }
      
      updateWeapons(dt, metaStats) {
        const areaMult = 1.0 + (this.passives.pressure_boiler || 0) * 0.20 + (this.selectedClass === 'golem' ? 0.20 : 0);
        const dmgMult = metaStats.damageMult * (1 + (this.passives.volatile_oil || 0) * 0.15);

        if (this.weapons.soul_gatling) {
          this.shootTimer += dt;
          if (this.shootTimer >= 0.09) {
            this.shootTimer = 0;
            const p = this.projPool.obtain();
            if (p) {
              const spread = (Math.random() - 0.5) * 0.25;
              const angle = Math.atan2(this.facingY, this.facingX) + spread;
              p.init(this.px, this.py, Math.cos(angle), Math.sin(angle), 38 * dmgMult, 680, 999, false, '#f43f5e', true);
              this.audio.playShoot();
            }
          }
        } else {
          const revLvl = this.weapons.brass_revolver || 0;
          if (revLvl > 0) {
            this.shootTimer += dt;
            if (this.shootTimer >= Math.max(0.18, 0.45 - revLvl * 0.04)) {
              this.shootTimer = 0;
              const p = this.projPool.obtain();
              if (p) {
                p.init(this.px, this.py, this.facingX, this.facingY, (18 + revLvl * 4) * dmgMult, 520, 1, false, '#38bdf8');
                this.audio.playShoot();
              }
            }
          }
        }

        if (this.weapons.aether_furnace) {
          this.vortexTimer += dt;
          if (this.vortexTimer >= 0.18) {
            this.vortexTimer = 0;
            const rad = 145 * areaMult, dmg = 45 * dmgMult;
            const count = this.grid.query(this.px, this.py, rad, this.nearbyBuf), enemies = this.enemyPool.getActive();
            for (let i = 0; i < count; i++) {
              const e = enemies[this.nearbyBuf[i]];
              if (e && e.active && Math.hypot(e.x - this.px, e.y - this.py) < rad + e.radius) {
                this.hitEnemy(e, dmg, 0, 0);
              }
            }
          }
        } else {
          const vortexLvl = this.weapons.steam_vortex || 0;
          if (vortexLvl > 0) {
            this.vortexTimer += dt;
            if (this.vortexTimer >= 0.25) {
              this.vortexTimer = 0;
              const rad = (60 + vortexLvl * 8) * areaMult, dmg = (6 + vortexLvl * 3) * dmgMult;
              const count = this.grid.query(this.px, this.py, rad, this.nearbyBuf), enemies = this.enemyPool.getActive();
              for (let i = 0; i < count; i++) {
                const e = enemies[this.nearbyBuf[i]];
                if (e && e.active && Math.hypot(e.x - this.px, e.y - this.py) < rad + e.radius) {
                  this.hitEnemy(e, dmg, 0, 0);
                }
              }
            }
          }
        }

        if (this.weapons.tesla_judgement) {
          this.teslaTimer += dt;
          if (this.teslaTimer >= 0.9) {
            this.teslaTimer = 0;
            const enemies = this.enemyPool.getActive();
            let hits = 0;
            for (let i = 0; i < enemies.length; i++) {
              const e = enemies[i];
              if (e && e.active && Math.hypot(e.x - this.px, e.y - this.py) < 550 * areaMult) {
                this.hitEnemy(e, 95 * dmgMult, 0, 0);
                hits++; if (hits >= 8) break;
              }
            }
          }
        } else {
          const teslaLvl = this.weapons.galvanic_strike || 0;
          if (teslaLvl > 0) {
            this.teslaTimer += dt;
            if (this.teslaTimer >= 2.0) {
              this.teslaTimer = 0;
              const enemies = this.enemyPool.getActive();
              let hits = 0;
              for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (e && e.active && Math.hypot(e.x - this.px, e.y - this.py) < 400 * areaMult) {
                  const dmg = (35 + teslaLvl * 8) * dmgMult;
                  this.hitEnemy(e, dmg, 0, 0);
                  hits++; if (hits >= 2 + teslaLvl) break;
                }
              }
            }
          }
        }

        const isPlague = !!this.weapons.plague_deluge;
        const acidLvl = this.weapons.acid_flask || 0;
        if (acidLvl > 0 || isPlague) {
          this.acidTimer += dt;
          if (this.acidTimer >= (isPlague ? 1.2 : 2.5)) {
            this.acidTimer = 0;
            const p = new AcidPuddle();
            const angle = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;
            p.init(this.px + Math.cos(angle) * d, this.py + Math.sin(angle) * d, (isPlague ? 38 : 12 + acidLvl * 5) * dmgMult, (isPlague ? 90 : 45 + acidLvl * 6) * areaMult, isPlague);
            this.puddles.push(p);
          }
        }

        const isThorn = !!this.weapons.thorn_vortex;
        const chainLvl = this.weapons.aether_chains || 0;
        if (chainLvl > 0 || isThorn) {
          this.chainAngle += dt * (isThorn ? 7.5 : 4.5);
          const rad = (isThorn ? 110 : 65 + chainLvl * 8) * areaMult;
          const cx = this.px + Math.cos(this.chainAngle) * rad, cy = this.py + Math.sin(this.chainAngle) * rad;
          const count = this.grid.query(cx, cy, 26, this.nearbyBuf), enemies = this.enemyPool.getActive();
          for (let i = 0; i < count; i++) {
            const e = enemies[this.nearbyBuf[i]];
            if (e && e.active && Math.hypot(e.x - cx, e.y - cy) < 26 + e.radius) {
              this.hitEnemy(e, (isThorn ? 30 : 8 + chainLvl * 4) * dmgMult, 0, 0);
            }
          }
        }

        const gearLvl = this.weapons.gear_launcher || 0;
        if (gearLvl > 0) {
          this.gearTimer += dt;
          if (this.gearTimer >= 1.2) {
            this.gearTimer = 0;
            const p = this.projPool.obtain();
            if (p) {
              p.init(this.px, this.py, this.facingX, this.facingY, (22 + gearLvl * 6) * dmgMult, 450, 2 + gearLvl, false, '#a855f7');
              this.audio.playShoot();
            }
          }
        }
      }
      
      killEnemy(e) {
        if (e.isKamikaze) {
          if (Math.hypot(this.px - e.x, this.py - e.y) < 85) {
            this.hp -= e.damage;
            this.trauma = Math.min(1.0, this.trauma + 0.4);
          }
          this.audio.playExplosion();
        }
        
        const particleCount = e.isBoss ? 50 : 10;
        for (let i = 0; i < particleCount; i++) {
          const sp = this.sparkPool.obtain();
          if (sp) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 50 + Math.random() * 350;
            let pColor = '#cbd5e1';
            if (e.isKamikaze) pColor = '#ef4444';
            else if (e.isShielded) pColor = '#38bdf8';
            else if (e.isBoss) pColor = '#f59e0b';
            sp.init(e.x, e.y, Math.cos(ang) * spd, Math.sin(ang) * spd - 150, pColor);
          }
        }
        
        this.kills++;
        const goldMult = this.eclipseMode ? 3 : 1;
        
        if (e.isFinalBoss) {
          this.runGold += 250 * goldMult;
          this.triggerGameOver(false);
          return;
        } else if (e.isBoss) {
          this.runGold += 50 * goldMult;
          const ch = new Chest(); ch.init(e.x, e.y);
          this.chests.push(ch);
        } else {
          this.runGold += 2 * goldMult;
          const gem = this.gemPool.obtain();
          if (gem) gem.init(e.x, e.y, this.eclipseMode ? 25 : 15);
        }
        this.enemyPool.release(e);
      }
      
      getEligibleEvolutions() {
        const evos = [];
        Object.keys(EVOLUTIONS).forEach(k => {
          const evo = EVOLUTIONS[k];
          if (!this.weapons[evo.id]) {
            const hasBaseMax = (this.weapons[evo.baseWeapon] || 0) >= 5;
            const hasPassive = (this.passives[evo.reqPassive] || 0) >= 1;
            if (hasBaseMax && hasPassive) {
              evos.push(evo);
            }
          }
        });
        return evos;
      }
      
      openChest() {
        this.isPaused = true;
        this.audio.playLevelUp();
        const ui = document.getElementById('chest-ui');
        const container = document.getElementById('chest-rewards');
        container.innerHTML = '';
        const evos = this.getEligibleEvolutions();
        if (evos.length > 0) {
          this.audio.playEvolutionFanfare();
          const evo = evos[0];
          this.weapons[evo.id] = 1;
          delete this.weapons[evo.baseWeapon];
          const item = document.createElement('div');
          item.style.background = 'linear-gradient(135deg, #4c1d95, #831843)';
          item.style.border = '2px solid #f59e0b';
          item.style.padding = '12px';
          item.style.borderRadius = '8px';
          item.style.color = '#fef08a';
          item.style.fontWeight = 'bold';
          item.style.fontSize = '14px';
          item.innerHTML = `🌟 ¡FUSIÓN Y EVOLUCIÓN DESBLOQUEADA!<br><span style="font-size:16px; color:#fde047;">${evo.name}</span><br><span style="font-size:11px; color:#cbd5e1; font-weight:normal;">${evo.desc}</span>`;
          container.appendChild(item);
        } else {
          const available = UPGRADE_POOL.slice().sort(() => Math.random() - 0.5).slice(0, 3);
          available.forEach((r) => {
            if (r.isPass) this.passives[r.id] = (this.passives[r.id] || 0) + 1;
            else this.weapons[r.id] = (this.weapons[r.id] || 0) + 1;
            const item = document.createElement('div');
            item.style.background = 'rgba(30, 41, 59, 0.9)';
            item.style.border = '1px solid #f59e0b';
            item.style.padding = '8px';
            item.style.borderRadius = '6px';
            item.style.color = '#fef08a';
            item.style.fontSize = '12px';
            item.innerText = `★ ${r.name} (+1 Nivel)`;
            container.appendChild(item);
          });
        }
        document.getElementById('btn-claim-chest').onclick = () => {
          ui.style.display = 'none';
          this.isPaused = false;
        };
        ui.style.display = 'flex';
      }
      
      addXP(amt) {
        this.xp += amt;
        if (this.xp >= this.xpNext) {
          this.xp -= this.xpNext;
          this.level++;
          this.xpNext = Math.floor(this.xpNext * 1.2);
          this.audio.playLevelUp();
          this.showLevelUp();
        }
      }
      
      showLevelUp() {
        this.isPaused = true;
        const container = document.getElementById('choices-container');
        container.innerHTML = '';
        const choices = [];
        const evos = this.getEligibleEvolutions();
        if (evos.length > 0) {
          choices.push({ ...evos[0], isEvo: true });
        }
        const standard = UPGRADE_POOL.filter(u => {
          const lvl = u.isPass ? (this.passives[u.id] || 0) : (this.weapons[u.id] || 0);
          return lvl < u.maxLvl;
        }).sort(() => Math.random() - 0.5);
        standard.forEach(s => {
          if (choices.length < 3 && !choices.some(c => c.id === s.id)) {
            choices.push(s);
          }
        });
        choices.forEach(c => {
          const card = document.createElement('div');
          card.className = `upgrade-card ${c.isEvo ? 'evolution' : ''}`;
          if (c.isEvo) {
            card.innerHTML = `
              <div style="font-weight:900; color:#fde047; font-size:13px;">${c.name}</div>
              <div style="font-size:11px; color:#fef08a;">${c.desc}</div>
            `;
            card.onclick = () => {
              this.audio.playEvolutionFanfare();
              this.weapons[c.id] = 1;
              delete this.weapons[c.baseWeapon];
              document.getElementById('levelup-ui').style.display = 'none';
              this.isPaused = false;
            };
          } else {
            const lvl = c.isPass ? (this.passives[c.id] || 0) + 1 : (this.weapons[c.id] || 0) + 1;
            card.innerHTML = `
              <div style="font-weight:bold; color:#fcd34d; font-size:13px;">${c.name} (Nv. ${lvl})</div>
              <div style="font-size:11px; color:#cbd5e1;">${c.desc}</div>
            `;
            card.onclick = () => {
              if (c.isPass) this.passives[c.id] = (this.passives[c.id] || 0) + 1;
              else this.weapons[c.id] = (this.weapons[c.id] || 0) + 1;
              document.getElementById('levelup-ui').style.display = 'none';
              this.isPaused = false;
            };
          }
          container.appendChild(card);
        });
        document.getElementById('levelup-ui').style.display = 'flex';
      }
      
      triggerGameOver(died) {
        this.isPaused = true;
        const ui = document.getElementById('gameover-ui');
        document.getElementById('go-title').innerText = died ? 'NÚCLEO DESTRUIDO' : '🏆 ¡VICTORIA! ECLIPSE COMPLETADO';
        document.getElementById('go-title').style.color = died ? '#ef4444' : '#22c55e';
        document.getElementById('go-stats').innerHTML = `Tiempo: <b>${this.formatTime(this.gameTime)}</b><br>Espectros: <b>${this.kills}</b><br>Oro de expedición: <b>🪙 ${this.runGold}</b>`;
        const btnRevive = document.getElementById('btn-revive');
        btnRevive.style.display = (died && !this.hasRevived) ? 'block' : 'none';
        btnRevive.onclick = () => {
          this.hasRevived = true;
          this.hp = this.maxHp * 0.5;
          ui.style.display = 'none';
          this.isPaused = false;
        };
        document.getElementById('btn-double').onclick = () => {
          this.meta.data.gold += this.runGold * 2;
          this.meta.save();
          this.returnToMenu();
        };
        document.getElementById('btn-back-menu').onclick = () => {
          this.meta.data.gold += this.runGold;
          this.meta.save();
          this.returnToMenu();
        };
        ui.style.display = 'flex';
      }
      
      returnToMenu() {
        document.getElementById('gameover-ui').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('menu-ui').style.display = 'flex';
        this.renderTalentsMenu();
      }
      
      updateHUD() {
        document.getElementById('xp-fill').style.width = `${(this.xp / this.xpNext) * 100}%`;
        document.getElementById('lvl-txt').innerText = `NIVEL ${this.level}`;
        document.getElementById('time-txt').innerText = this.formatTime(this.gameTime);
        document.getElementById('hp-txt').innerText = `HP ${Math.ceil(this.hp)}/${this.maxHp}`;
        document.getElementById('gold-txt').innerText = `🪙 ${this.runGold}`;
      }
      
      formatTime(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0'), sec = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      }
      
      render(dt) {
        const ctx = this.ctx;
        ctx.save();
        if (this.trauma > 0) {
          const shk = this.trauma * this.trauma * 14;
          ctx.translate((Math.random() * 2 - 1) * shk, (Math.random() * 2 - 1) * shk);
        }
        
        const isRust = this.selectedMap === 'rust';
        ctx.fillStyle = isRust ? 'rgba(19, 10, 6, 0.35)' : 'rgba(6, 9, 19, 0.35)';
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        ctx.save();
        ctx.translate(this.canvas.width / 2 - this.px, this.canvas.height / 2 - this.py);
        
        const pulse = 1 + Math.sin(this.gameTime * 4) * 0.5;
        ctx.strokeStyle = isRust ? 'rgba(67, 30, 15, 0.4)' : 'rgba(30, 41, 59, 0.25)'; 
        ctx.lineWidth = pulse;
        const startX = Math.floor((this.px - this.canvas.width / 2) / 64) * 64, startY = Math.floor((this.py - this.canvas.height / 2) / 64) * 64;
        for (let x = startX; x < startX + this.canvas.width + 128; x += 64) {
          ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY + this.canvas.height + 128); ctx.stroke();
        }
        for (let y = startY; y < startY + this.canvas.height + 128; y += 64) {
          ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(startX + this.canvas.width + 128, y); ctx.stroke();
        }

        for (let i = 0; i < this.puddles.length; i++) this.puddles[i].render(ctx);
        const enemies = this.enemyPool.getActive();
        for (let i = 0; i < enemies.length; i++) enemies[i].render(ctx);
        
        ctx.save(); ctx.translate(this.px, this.py);
        ctx.shadowBlur = 18; ctx.shadowColor = CLASSES[this.selectedClass].color;
        ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = CLASSES[this.selectedClass].color; ctx.lineWidth = 2.5; ctx.stroke();
        
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = CLASSES[this.selectedClass].color; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(this.facingX * 18, this.facingY * 18); ctx.stroke();
        ctx.restore();

        ctx.globalCompositeOperation = 'lighter';
        if (this.weapons.aether_furnace) {
          const areaMult = 1.0 + (this.passives.pressure_boiler || 0) * 0.20 + (this.selectedClass === 'golem' ? 0.20 : 0);
          const rad = 145 * areaMult;
          ctx.save(); ctx.shadowBlur = 30; ctx.shadowColor = '#38bdf8';
          ctx.beginPath(); ctx.arc(this.px, this.py, rad, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(2, 132, 199, 0.18)'; ctx.fill();
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3.5; ctx.stroke();
          ctx.restore();
        } else {
          const vortexLvl = this.weapons.steam_vortex || 0;
          if (vortexLvl > 0) {
            const areaMult = 1.0 + (this.passives.pressure_boiler || 0) * 0.20 + (this.selectedClass === 'golem' ? 0.20 : 0);
            const rad = (60 + vortexLvl * 8) * areaMult;
            ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(56, 189, 248, 0.4)';
            ctx.beginPath(); ctx.arc(this.px, this.py, rad, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(14, 165, 233, 0.08)'; ctx.fill();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
          }
        }

        const isThorn = !!this.weapons.thorn_vortex;
        const chainLvl = this.weapons.aether_chains || 0;
        if (chainLvl > 0 || isThorn) {
          const areaMult = 1.0 + (this.passives.pressure_boiler || 0) * 0.20;
          const rad = (isThorn ? 110 : 65 + chainLvl * 8) * areaMult;
          const cx = this.px + Math.cos(this.chainAngle) * rad, cy = this.py + Math.sin(this.chainAngle) * rad;
          ctx.save();
          ctx.strokeStyle = isThorn ? '#f43f5e' : '#cbd5e1'; ctx.lineWidth = isThorn ? 4 : 2;
          ctx.beginPath(); ctx.moveTo(this.px, this.py); ctx.lineTo(cx, cy); ctx.stroke();
          ctx.fillStyle = isThorn ? '#fb7185' : '#f8fafc'; ctx.beginPath(); ctx.arc(cx, cy, isThorn ? 12 : 7, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        const gems = this.gemPool.getActive();
        for (let i = 0; i < gems.length; i++) gems[i].render(ctx);
        for (let i = 0; i < this.chests.length; i++) this.chests[i].render(ctx, dt);
        const projs = this.projPool.getActive();
        for (let i = 0; i < projs.length; i++) projs[i].render(ctx);
        const sparks = this.sparkPool.getActive();
        for (let i = 0; i < sparks.length; i++) sparks[i].render(ctx);
        
        ctx.globalCompositeOperation = 'source-over'; 
        
        const dmgTexts = this.dmgTextPool.getActive();
        for (let i = 0; i < dmgTexts.length; i++) dmgTexts[i].render(ctx);
        
        ctx.restore(); 

        const darknessStart = this.eclipseMode ? 60 : 300;
        if (this.gameTime >= darknessStart) {
          ctx.save();
          const grad = ctx.createRadialGradient(this.canvas.width / 2, this.canvas.height / 2, 90, this.canvas.width / 2, this.canvas.height / 2, 400);
          const bgR = isRust ? 19 : 4;
          const bgG = isRust ? 10 : 7;
          const bgB = isRust ? 6 : 17;
          const maxDark = this.eclipseMode ? 0.99 : 0.96;
          
          grad.addColorStop(0, `rgba(${bgR}, ${bgG}, ${bgB}, 0)`);
          grad.addColorStop(0.65, `rgba(${bgR}, ${bgG}, ${bgB}, 0.7)`);
          grad.addColorStop(1, `rgba(${bgR}, ${bgG}, ${bgB}, ${maxDark})`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          ctx.restore();
        }

        if (this.touchActive) {
          ctx.beginPath(); ctx.arc(this.touchOriginX, this.touchOriginY, 50, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.35)'; ctx.fill();
          ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
          ctx.beginPath(); ctx.arc(this.touchCurrentX, this.touchCurrentY, 20, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(245, 158, 11, 0.7)'; ctx.fill();
        }
        ctx.restore();
      }
    }
    window.onload = () => { new GameEngine(); };
  </script>
